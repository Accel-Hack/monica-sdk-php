name: ci

# PHP SDK の検査。見るのは 4 つ。
#
#   - test:    対応する PHP 全版で振る舞いと契約テストが通ること
#   - spec:    取り込んだ公開契約が配信元から動いていないこと
#   - package: Packagist が配る tarball の中身と、それだけで autoload できること
#   - release: タグと SDK_VERSION が一致すること（タグを打ったときだけ）
#
# PHP の版は 7.4 / 8.0 / 8.3。下限が対応保証の下限で、7.4 は composer.json の
# require、8.0 は導入先の実行環境、8.3 は現行安定版。

on:
  pull_request:
  push:
    branches: [main]
    # タグでも回す。release job のためだけでなく、配布される commit で
    # test / spec / package が通っていることを残すため。
    #
    # `v` 無しも拾う。Packagist は先頭の `v` を落として version にするので、
    # `0.1.1` というタグでも配布は成立してしまう。ここで拾っておかないと、
    # 綴りを外したタグだけが検査を素通りする。
    tags: ["v*", "[0-9]*"]
  # 定期実行はしない。公開契約が動いたことは PR と main への push で気付く。
  # repository が動いていない間の drift を能動的に知りたいときは、この workflow を
  # workflow_dispatch で回す。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.3"]
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, zlib
          coverage: none

      - name: execが使えることを確認
        # tests/fatal-runner.php は子プロセスを exec して fatal shutdown を見るので、
        # exec が無効な runtime では検証そのものが成立しない。
        run: |
          php -r 'exec("printf ok", $out, $code);
            if ($code !== 0 || ($out[0] ?? "") !== "ok") {
              fwrite(STDERR, "exec is unavailable; tests/fatal-runner.php cannot verify fatal shutdown\n");
              exit(1);
            }
            echo "exec available\n";'

      - name: Composer packageを検証
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer test

  spec:
    # 配信元を叩くので matrix から外してある。network の失敗で PHP 3 版の
    # job が道連れになると、落ちた理由が読めなくなる。
    #
    # この job だけが repository の外の状態を見る。他の job は commit の性質を
    # 見るので、落ちたら commit を直せば緑になるが、ここは配信元が動いた
    # ことでも落ちる。直し方は spec を取り込み直すこと。
    name: 公開契約
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json
          coverage: none

      - name: 取り込んだ specが配信元と一致するか
        # spec/ は https://spec.monica.accelhack.net/v1/ のコピー。配信元の
        # index.json の revision を取り込み済みのものと比べるだけなので安い。
        # ここが落ちたら php scripts/spec-sync.php で取り込み直し、契約テストを
        # 通してから commit する。
        run: php scripts/spec-sync.php --check-remote

  package:
    name: 配布物
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: json, zlib
          coverage: none

      - name: 配布物に開発用のファイルが入っていないか
        # .gitattributes の export-ignore は書いた本人にしか見えない。Packagist が
        # 配る tarball は git archive なので、そこで実際に確かめる。
        run: |
          git archive --format=tar HEAD > /tmp/package.tar
          tar -tf /tmp/package.tar | sort > /tmp/contents.txt
          sed 's/^/  /' /tmp/contents.txt
          for excluded in spec/ spec.lock.json scripts/ tests/ .github/; do
            if grep -q "^$excluded" /tmp/contents.txt; then
              echo "::error::配布物に $excluded が入っています。.gitattributes の export-ignore を確認してください。"
              exit 1
            fi
          done
          for required in src/Monica.php composer.json bin/monica LICENSE; do
            if ! grep -qx "$required" /tmp/contents.txt; then
              echo "::error::配布物に $required がありません。"
              exit 1
            fi
          done

      - name: 配布物だけでautoloadできるか
        # tests/ も vendor/ も無い状態で、src/ が読み込めることを見る。
        # PSR-4 の綴りや大文字小文字の取り違えは、ここでしか出ない。
        run: |
          mkdir -p /tmp/dist && tar -xf /tmp/package.tar -C /tmp/dist
          cd /tmp/dist
          composer install --no-interaction --no-dev --prefer-dist
          php -r 'require "vendor/autoload.php";
            foreach ([
              Monica\Monica::class,
              Monica\Client::class,
              Monica\EventFactory::class,
              Monica\Transport\CurlTransport::class,
              Monica\Transport\Psr18Transport::class,
              Monica\Transport\SpoolTransport::class,
              Monica\Transport\SpoolFlusher::class,
              Monica\Transport\Dsn::class,
              Monica\Transport\Response::class,
              Monica\Transport\Diagnostics::class,
              Monica\Transport\EnvelopeSplitter::class,
            ] as $class) {
              if (!class_exists($class)) {
                fwrite(STDERR, $class . " is not autoloadable from the published package\n");
                exit(1);
              }
            }
            foreach ([
              Monica\Transport\TransportInterface::class,
              Monica\Transport\OutcomeAwareInterface::class,
              Monica\Transport\ResponseAwareInterface::class,
              Monica\Transport\StoppableInterface::class,
            ] as $interface) {
              if (!interface_exists($interface)) {
                fwrite(STDERR, $interface . " is not autoloadable from the published package\n");
                exit(1);
              }
            }
            echo "autoload ok\n";'

  release:
    name: リリースタグ
    # Packagist は push webhook で version を拾うので、この job は配布を
    # 止められない（webhook は CI の結果を待たない）。目的は「食い違ったまま
    # 気付かない」を無くすこと。落ちたらタグを消して打ち直す。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: タグとSDK_VERSIONが一致するか
        # SDK_VERSION は src/Client.php の手書き定数で、そのまま全 event の
        # sdk.version として出る。ingest.md がこれを取り込み状況の集計単位と
        # 定めているので、タグと食い違うと集計が狂う。source を正規表現で
        # 読まず PHP 自身に読ませるのは、定数の書き方を変えても壊れないため。
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::タグ $tag が v<semver> の形ではありません。既にある v0.1.0 に合わせて v を付けてください。"
            exit 1
          fi
          expected="${tag#v}"
          declared="$(php -r 'require "src/Client.php"; echo Monica\Client::SDK_VERSION;')"
          if [ "$declared" != "$expected" ]; then
            echo "::error::タグ $tag と src/Client.php の SDK_VERSION ($declared) が一致しません。全 event の sdk.version は $declared として出るので、定数を $expected に直してからタグを打ち直してください。"
            exit 1
          fi
          echo "tag $tag = SDK_VERSION $declared"

      - name: composer.jsonがversionを宣言していないか
        # version の出所を「タグ」と「SDK_VERSION」の 2 つに留める。composer.json
        # にも version があると 3 つ目の食い違いが生まれ、上の検査を通しても
        # Packagist が別の版を配ることになる。
        run: |
          php -r '$c = json_decode(file_get_contents("composer.json"), true);
            if (isset($c["version"])) {
              fwrite(STDERR, "composer.json declares version " . $c["version"]
                . "; Packagist derives the version from the tag, so remove it\n");
              exit(1);
            }
            echo "composer.json leaves the version to the tag\n";'
