name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # composer.json requires >=7.4, Liew runs 8.0, 8.3 is the current stable.
        php: ["7.4", "8.0", "8.3"]
    steps:
      # submodule はここでは取らない。checkout に任せると、private repository が
      # 404 で返るせいで「repository not found」だけが出て原因が読めない。
      - uses: actions/checkout@v6

      # .spec-src は private な Accel-Hack/monica を指すので、GITHUB_TOKEN では読めない。
      # 全 SDK repository が同じ App を使えるよう、token は GitHub App から作る。
      # App が未設定でも失敗の理由が読めるよう、ここでは落とさず次の step で判定する。
      - name: 仕様repositoryのread tokenを作る
        id: spec-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SPEC_APP_ID }}
          private-key: ${{ secrets.SPEC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: monica

      - name: 仕様submoduleを取得
        env:
          # App が入るまでは PAT を SPEC_READ_TOKEN に置いても動く。
          SPEC_TOKEN: ${{ steps.spec-token.outputs.token || secrets.SPEC_READ_TOKEN }}
        run: |
          if [ -z "$SPEC_TOKEN" ]; then
            echo "::error::Accel-Hack/monica を読む token がありません。private repository は 403 ではなく 404 を返すため、GITHUB_TOKEN では submodule が「repository not found」になります。organization variable SPEC_APP_ID と secret SPEC_APP_PRIVATE_KEY に、Accel-Hack/monica の Contents:read を持つ GitHub App を設定してください（暫定なら secret SPEC_READ_TOKEN に PAT でも動きます）。"
            exit 1
          fi
          # 記録された commit を取りたいので checkout ではなく submodule update を使う。
          git -c "url.https://x-access-token:$SPEC_TOKEN@github.com/.insteadOf=https://github.com/" \
            submodule update --init --depth 1 .spec-src
          # spec/ 以外は要らない。README が案内する手順が CI でも成立することの確認も兼ねる。
          git -C .spec-src sparse-checkout init --cone
          git -C .spec-src sparse-checkout set spec
          if [ ! -f .spec-src/spec/event-schema.json ]; then
            echo "::error::.spec-src/spec/event-schema.json がありません。submodule は取れましたが spec/ が入っていません。"
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, zlib
          coverage: none

      - name: execが使えることを確認
        # tests/fatal-runner.php は子プロセスを exec して fatal shutdown を見るので、
        # exec が無効な runtime では検証そのものが成立しない。
        run: |
          php -r 'exec("printf ok", $out, $code);
            if ($code !== 0 || ($out[0] ?? "") !== "ok") {
              fwrite(STDERR, "exec is unavailable; tests/fatal-runner.php cannot verify fatal shutdown\n");
              exit(1);
            }
            echo "exec available\n";'

      - name: Composer packageを検証
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer test
