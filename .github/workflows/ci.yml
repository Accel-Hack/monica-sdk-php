name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # composer.json requires >=7.4, Liew runs 8.0, 8.3 is the current stable.
        php: ["7.4", "8.0", "8.3"]
    steps:
      # submodule はここでは取らない。checkout に任せると、private repository が
      # 404 で返るせいで「repository not found」だけが出て原因が読めない。
      - uses: actions/checkout@v6

      - name: PREFLIGHT-ONLY
        run: echo "throwaway branch - spec submodule and contract test are skipped"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, zlib
          coverage: none

      - name: execが使えることを確認
        # tests/fatal-runner.php は子プロセスを exec して fatal shutdown を見るので、
        # exec が無効な runtime では検証そのものが成立しない。
        run: |
          php -r 'exec("printf ok", $out, $code);
            if ($code !== 0 || ($out[0] ?? "") !== "ok") {
              fwrite(STDERR, "exec is unavailable; tests/fatal-runner.php cannot verify fatal shutdown\n");
              exit(1);
            }
            echo "exec available\n";'

      - name: Composer packageを検証
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          php tests/run.php
          php tests/fatal-runner.php
